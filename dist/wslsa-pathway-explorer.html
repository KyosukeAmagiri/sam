<style>
/* WSLSA 2027 Degree Pathway Explorer: screen styles, aligned with wslsa.com.au.
   Layout: white masthead → burgundy hero band with seal → sticky command dock → stat ribbon →
   charcoal advisory bar → micro-legend → year cards (charcoal bar, Autumn | Spring) →
   tabbed drawer → charcoal footer.
   One deliberate light theme: cream canvas, burgundy and charcoal bands, gold accents,
   Cormorant Garamond display type with tracked Inter capitals. Print styles live in print.css. */

:root {
  --canvas: #F6F1EA;
  --surface: #FFFFFF;
  --surface-2: #F2ECE4;
  --ink: #1E1D20;
  --ink-2: #29282B;
  --text: #2A282B;
  --muted: #625D60;
  --faint: #918B8E;
  --hairline: #E6E0D7;
  --hairline-2: #D5CDC1;

  --burgundy: #7D0028;
  --crimson: #8B0029;
  --crimson-hi: #990033;
  --crimson-tint: #FDF2F4;
  --blush: #F2CCD6;
  --gold: #C59B27;
  --bronze: #B48A1E;
  --gold-soft: #E3C774;
  --gold-tint: #FBF6E8;

  --slate: #334155;
  --slate-tint: #F1F5F9;
  --teal: #0F766E;
  --teal-tint: #F0FDFA;
  --amber: #D97706;
  --amber-ink: #92400E;
  --amber-solid: #B45309;
  --amber-tint: #FFFDF5;
  --ok: #15803D;
  --ok-tint: #ECFDF3;
  --focus: #1D4ED8;

  --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius: 4px;
  --shadow: 0 1px 2px rgba(30, 29, 32, .05), 0 10px 30px rgba(30, 29, 32, .06);
  --shadow-lg: 0 24px 60px rgba(30, 29, 32, .3);
  --texture: repeating-linear-gradient(118deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 26px);
  --gutter: max(24px, env(safe-area-inset-left, 0px));
  --gutter-r: max(24px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
body {
  margin: 0; background: var(--canvas); color: var(--text);
  font: 15px/1.55 var(--sans); font-feature-settings: "cv11", "ss03";
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--crimson); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter-r); }
.stack { display: grid; gap: 18px; padding-block: 18px 64px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* tracked-capital labels and kickers, wslsa.com.au style ("—— WHO WE ARE") */
.caps { font: 700 11px/1.4 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.kicker { display: block; margin: 0; font: 700 11.5px/1.6 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--crimson); }
.kicker::before { content: ""; display: inline-block; vertical-align: middle; width: 34px; height: 1px; margin: -2px 12px 0 0; background: currentColor; }
.kicker i { font-style: normal; opacity: .7; padding: 0 .15em; }

/* ---------- buttons: square, tracked capitals, arrow CTAs */
.tbtn, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 16px;
  border-radius: 2px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer;
  font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; text-decoration: none;
  transition: background .15s, color .15s, border-color .15s;
}
.tbtn:hover, .btn:hover { color: var(--crimson); }
.tbtn-primary, .btn-primary { background: var(--crimson); color: #fff; border-color: var(--crimson); padding-inline: 20px; }
.tbtn-primary:hover, .btn-primary:hover { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }
.btn:not(.btn-primary):not(.btn-ghost) { border-color: var(--hairline-2); background: var(--surface); }
.tbtn-outline { border-color: var(--crimson); color: var(--crimson); }
.tbtn-outline:hover { background: var(--crimson); color: #fff; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }

/* ---------- masthead (white, as on wslsa.com.au) */
.topbar { background: var(--surface); border-bottom: 1px solid var(--hairline); }
.topbar-inner {
  max-width: 1280px; margin: 0 auto; padding-block: 12px; padding-left: var(--gutter); padding-right: var(--gutter-r);
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
}
.crest { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; min-width: 0; }
.crest-mark { flex: none; width: 40px; height: 40px; }
.crest-mark svg { width: 100%; height: 100%; display: block; }
.crest-text { display: grid; min-width: 0; font: 600 15px/1.2 var(--sans); color: var(--ink); }
.crest-text small { font: 700 9.5px/1.5 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--crimson); margin-top: 2px; }
.top-actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.top-link { color: var(--muted); }

/* ---------- burgundy hero band */
.hero-band { position: relative; overflow: hidden; background-color: var(--burgundy); background-image: var(--texture); color: #fff; }
.hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; padding-block: 34px 30px; }
.hero-band .kicker { color: var(--blush); }
.hero-app { margin: 16px 0 0; font: italic 500 22px/1.2 var(--serif); color: var(--blush); }
.hero-app b { font-style: normal; font-weight: 700; color: var(--gold-soft); }
.hero-band h1 { margin: 2px 0 0; font: 600 clamp(36px, 5vw, 60px)/1.02 var(--serif); letter-spacing: -.005em; color: #fff; text-wrap: balance; }
.hero-band h1 .slash { color: var(--gold-soft); font-style: italic; font-weight: 500; padding: 0 .06em; }
.hero-meta { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: var(--blush); }
.hero-meta .course { font: 700 12.5px var(--mono); color: #fff; border: 1px solid rgba(255, 255, 255, .35); padding: 3px 8px; border-radius: 2px; }
.hero-meta .major { color: #fff; font-weight: 600; }
.pbadge { display: inline-flex; align-items: center; gap: 7px; font: 700 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft); padding: 6px 10px; border: 1px solid rgba(227, 199, 116, .55); border-radius: 2px; }
.pbadge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.why-btn { background: none; border: 0; padding: 0; color: #fff; font: 700 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid var(--gold); padding-bottom: 2px; }
.why-text { flex-basis: 100%; margin: 4px 0 0; max-width: 92ch; color: #f6dfe5; font-size: 14px; line-height: 1.6; }
.why-text b { color: #fff; }
.hero-seal { width: 190px; height: 190px; flex: none; }
.hero-seal svg { width: 100%; height: 100%; display: block; }
.hero-watermark { position: absolute; right: -60px; top: -40px; width: 420px; height: auto; z-index: 0; pointer-events: none; opacity: .9; }

/* ---------- sticky command dock */
.dock {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; padding-block: 10px;
  background: color-mix(in srgb, var(--canvas) 88%, transparent);
  backdrop-filter: saturate(1.3) blur(10px); -webkit-backdrop-filter: saturate(1.3) blur(10px);
  border-bottom: 1px solid transparent;
}
.dock-card {
  display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(0, 2fr) minmax(0, 1.25fr) auto minmax(200px, 1.35fr);
  gap: 10px 16px; align-items: end; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--hairline); border-top: 2px solid var(--crimson); border-radius: var(--radius); box-shadow: var(--shadow);
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font: 700 10px/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.select-wrap { position: relative; }
.select-wrap select {
  width: 100%; appearance: none; -webkit-appearance: none; min-height: 40px; padding: 8px 34px 8px 11px;
  border: 1px solid var(--hairline-2); border-radius: 2px; background: var(--surface); color: var(--ink);
  font-size: 14px; font-weight: 600; cursor: pointer; text-overflow: ellipsis;
}
.select-wrap select:hover { border-color: var(--muted); }
.select-wrap::after {
  content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; margin-top: -5px;
  border-right: 1.5px solid var(--crimson); border-bottom: 1.5px solid var(--crimson); transform: rotate(45deg); pointer-events: none;
}
.locked { display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 7px 11px; border-radius: 2px; background: var(--surface-2); border: 1px dashed var(--hairline-2); color: var(--muted); font-size: 13px; line-height: 1.3; }
.locked svg { flex: none; color: var(--bronze); }
.locked b { color: var(--text); }
.segmented { display: inline-flex; border: 1px solid var(--hairline-2); border-radius: 2px; background: var(--surface); }
.segmented button { border: 0; background: none; padding: 0 13px; min-height: 38px; font: 700 10.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); cursor: pointer; white-space: nowrap; }
.segmented button + button { border-left: 1px solid var(--hairline-2); }
.segmented button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.progress { display: grid; gap: 6px; min-width: 0; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.progress-num { font: 700 14.5px var(--mono); color: var(--ink); white-space: nowrap; }
.progress-num small { font: 700 9.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--crimson), var(--gold)); transition: width .35s ease; }
.progress-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- stat ribbon (wslsa.com.au stats band) */
.ribbon { display: flex; flex-wrap: wrap; align-items: stretch; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); }
.ribbon > div { flex: 0 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 14px 22px; border-right: 1px solid var(--hairline); min-width: 0; }
.ribbon > div:last-child { border-right: 0; margin-left: auto; padding-right: 16px; }
.rb-v { order: 1; font: 600 22px/1.1 var(--serif); color: var(--ink); }
.rb-v.big { font-size: 34px; line-height: .95; color: var(--crimson); }
.rb-v small { font: 500 14px var(--serif); color: var(--muted); }
.rb-l { order: 2; font: 700 9.5px/1.3 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.ribbon .handbook { align-self: center; }

/* ---------- advisory callout (charcoal, gold capitals) */
.advisory { border-radius: var(--radius); background: var(--surface); border: 1px solid var(--hairline); box-shadow: var(--shadow); overflow: hidden; }
.advisory > summary {
  display: flex; align-items: center; gap: 14px; padding: 13px 18px; cursor: pointer; list-style: none;
  background: var(--ink); color: #fff; border-left: 4px solid var(--adv, var(--gold));
}
.advisory > summary::-webkit-details-marker { display: none; }
.adv-crit { --adv: var(--crimson-hi); }
.adv-warn { --adv: var(--gold); }
.adv-ok { --adv: var(--ok); }
.adv-icon { flex: none; width: 19px; height: 19px; color: var(--gold); }
.adv-crit .adv-icon { color: #ff8aa8; }
.adv-label { font: 700 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.adv-counts { flex: 1; min-width: 0; font-size: 14px; color: #e6e1da; }
.adv-counts b { color: #fff; }
.adv-cta { flex: none; font: 700 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: #fff; white-space: nowrap; border-bottom: 1px solid var(--gold); padding-bottom: 2px; }
.adv-cta::after { content: " ▾"; color: var(--gold); }
.advisory[open] .adv-cta::after { content: " ▴"; }
.adv-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.adv-sec { padding: 16px 20px 18px; border-top: 1px solid var(--hairline); border-right: 1px solid var(--hairline); }
.adv-sec h3 { margin: 0 0 8px; font: 600 23px/1.15 var(--serif); color: var(--ink); display: flex; align-items: baseline; gap: 8px; }
.adv-sec h3 .idx { font: 700 11px var(--mono); color: var(--crimson); }
.adv-sec p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); }
.adv-sec p b { color: var(--text); }
.adv-sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.adv-sec li { font-size: 13.5px; line-height: 1.55; }
.note-scope { display: block; font: 700 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--crimson); margin-bottom: 3px; }
.note-scope.related { color: var(--slate); }
.where { display: inline-block; font: 700 11.5px var(--mono); padding: 1px 7px; border-radius: 2px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--hairline); margin-right: 6px; cursor: pointer; }
.where:hover { border-color: var(--crimson); color: var(--crimson); }
.hint { display: block; margin-top: 5px; font-size: 12.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--gold); }
.hint b { color: var(--text); }
.chiplist { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 9px; border-radius: 2px; background: var(--amber-tint); border: 1px solid #f1d6a8; font-size: 12.5px; cursor: pointer; text-align: left; }
.chipbtn code { font: 700 11.5px var(--mono); color: var(--amber-ink); }
.chipbtn span { color: var(--muted); font-size: 11.5px; }
.chipbtn:hover { border-color: var(--amber); }
.linkish { background: none; border: 0; padding: 0; color: var(--crimson); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

/* ---------- micro legend */
.micro-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); font-size: 12.5px; color: var(--muted); }
.lg-title { font: 700 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }
.lg-group { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; }
.lg-sw { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-sw i { width: 14px; height: 14px; background: #fff; border: 1px solid var(--hairline-2); border-left: 3px solid var(--k); }
.lg-sw.slot i { border: 1.5px dashed var(--amber); background: var(--amber-tint); }
.lg-camp { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.lg-sep { width: 1px; align-self: stretch; background: var(--hairline); }

/* ---------- campus pills */
.pills { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.pill {
  --dot: var(--faint);
  position: relative; display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 7px 0 6px;
  border-radius: 999px; background: var(--surface-2); border: 1px solid var(--hairline); color: var(--ink);
  font: 700 10.5px/1 var(--mono); letter-spacing: .03em; user-select: none; transition: opacity .15s, background .15s;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
.pill[role="button"] { cursor: pointer; }
.pill[data-tip]:hover::after, .pill[data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; font: 600 12px/1.3 var(--sans); letter-spacing: 0; padding: 6px 9px; border-radius: 2px;
  white-space: nowrap; z-index: 60; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.cp-PS { --dot: #1F3A68; } .cp-PC { --dot: #2F5D9E; } .cp-EX { --dot: #5B6788; } .cp-CA { --dot: #8B0029; }
.cp-HA { --dot: #2D6936; } .cp-BC { --dot: #B45309; } .cp-PE { --dot: #6D4AA6; } .cp-LC { --dot: #0D6B71; }
.cp-ON { --dot: #15803D; }
.cp-TBC { background: var(--amber-tint); border: 1px dashed var(--amber); color: var(--amber-ink); }
.cp-TBC::before { display: none; }
.pill-y2026 { background: transparent; border-style: dashed; color: var(--muted); font-size: 9.5px; }
.pill-y2026::before { display: none; }
body.has-campus .pill.dim { opacity: .32; }
body.has-campus .pill.on { background: var(--crimson); border-color: var(--crimson); color: #fff; }
body.has-campus .pill.on::before { background: #fff; }
body.has-campus .pill.online { background: var(--ok-tint); border-color: #b6e2c4; color: var(--ok); }

/* ---------- year cards */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 6px; }
.section-head h2 { margin: 4px 0 0; font: 600 34px/1.1 var(--serif); color: var(--ink); }
.grid { display: grid; gap: 22px; }
.pt-note { margin: 0; padding: 12px 16px; background: var(--slate-tint); color: var(--slate); font-size: 13.5px; border-left: 3px solid var(--slate); }
.year { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); box-shadow: var(--shadow); }
.year-bar {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  background-color: var(--ink); background-image: var(--texture); color: #fff; border-radius: var(--radius) var(--radius) 0 0;
}
.year-bar::after {
  content: attr(data-roman); position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
  font: italic 600 110px/1 var(--serif); color: rgba(197, 155, 39, .1); pointer-events: none;
}
.year-seal {
  flex: none; display: grid; place-items: center; min-width: 48px; height: 48px; padding: 0 6px; border-radius: 24px;
  border: 1px dashed rgba(197, 155, 39, .7); box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px rgba(197, 155, 39, .35);
  color: var(--gold); font: 600 21px/1 var(--serif); letter-spacing: .04em;
}
.year-titles { display: grid; gap: 2px; }
.year-titles .caps { color: var(--gold); font-size: 9.5px; }
.year-bar h2 { margin: 0; font: 600 30px/1 var(--serif); letter-spacing: .005em; }
.year-cp { margin-left: auto; position: relative; z-index: 1; font: 600 12px var(--mono); color: #d8d2c8; text-align: right; }
.year-cp b { color: #fff; }
.year-cp .done { display: block; color: var(--gold); font-size: 11px; margin-top: 3px; }
.sessions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.session { min-width: 0; padding: 16px 16px 18px; }
.session + .session { border-left: 1px solid var(--hairline); }
.session-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
.session-head h3 { margin: 0; font: 600 24px/1 var(--serif); color: var(--ink); display: flex; align-items: baseline; gap: 8px; }
.session-head h3 span { font: 700 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--crimson); }
.session-tools { display: flex; align-items: baseline; gap: 14px; }
.session-cp { font: 700 12px var(--mono); color: var(--ink); }
.mark-all { background: none; border: 0; padding: 0 0 2px; font: 700 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 1px solid var(--hairline-2); }
.mark-all:hover { color: var(--crimson); border-color: var(--crimson); }
.slots { display: grid; gap: 8px; }
.slot-empty { padding: 18px; border: 1px dashed var(--hairline-2); color: var(--faint); font-size: 13px; text-align: center; }

/* ---------- subject cards */
.subj {
  --k: var(--crimson); --k-tint: var(--crimson-tint);
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center;
  padding: 11px 14px 11px 12px; background: var(--surface); border: 1px solid var(--hairline); border-left: 3px solid var(--k);
  border-radius: 3px; transition: opacity .25s ease, box-shadow .2s, border-color .2s, background .2s; scroll-margin-top: 140px;
}
.subj:hover { box-shadow: 0 3px 14px rgba(30, 29, 32, .07); }
.k-law { --k: var(--crimson); --k-tint: var(--crimson-tint); }
.k-nonlaw { --k: var(--slate); --k-tint: var(--slate-tint); }
.k-major { --k: var(--teal); --k-tint: var(--teal-tint); }
.k-slot { --k: var(--amber-solid); --k-tint: #FEF3C7; }
.k-slot.is-pending { background: var(--amber-tint); border: 1.5px dashed var(--amber); }
.k-slot.is-chosen { border-color: #EBC98F; border-left-color: var(--amber-solid); }
.subj.is-done { opacity: .58; }
.subj.is-done:hover { opacity: .85; }
.subj.flash { animation: flash 1.3s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
.subj-lead { display: flex; align-items: center; gap: 10px; align-self: start; padding-top: 1px; }
.code-pill { font: 700 12px/1 var(--mono); letter-spacing: .02em; padding: 6px 8px; border-radius: 2px; background: var(--k-tint); color: var(--k); white-space: nowrap; }
.is-pending .code-pill { background: transparent; border: 1px dashed var(--amber); color: var(--amber-ink); }
.subj-main { min-width: 0; }
.subj-title { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
.is-pending .subj-title { color: var(--amber-ink); font-weight: 600; }
.subj.is-done .subj-title { text-decoration: line-through; text-decoration-color: rgba(30, 29, 32, .35); }
.subj-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
.cat { font: 700 9.5px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--k); }
.flag { font: 700 10.5px/1.4 var(--sans); padding: 1px 7px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.flag-tbc { background: #FEF3C7; color: var(--amber-ink); }
.flag-2026 { border: 1px dashed var(--hairline-2); color: var(--muted); }
.flag-chosen { background: #FEF3C7; color: var(--amber-ink); }
.flag-campus { background: var(--slate-tint); color: var(--slate); }
.flag-warn { background: var(--crimson-tint); color: var(--crimson); text-decoration: none; cursor: pointer; border: 0; }
.flag-done { background: var(--ok-tint); color: var(--ok); }
.subj-note { margin-top: 4px; font-size: 12px; color: var(--muted); }
.subj-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: start; }
.cp-badge { font: 700 11px var(--mono); color: var(--ink); border: 1px solid var(--hairline-2); padding: 2px 7px; border-radius: 2px; white-space: nowrap; background: var(--surface); }
.subj-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 10px; }
.select-btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 8px 15px; border-radius: 2px; border: 0;
  background: var(--amber-solid); color: #fff; font: 700 10.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  transition: background .15s, transform .15s;
}
.select-btn:hover { background: var(--amber-ink); transform: translateX(2px); }
.text-btn { background: none; border: 0; padding: 0 0 2px; font: 700 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 1px solid var(--hairline-2); }
.text-btn:hover { color: var(--crimson); border-color: var(--crimson); }
.text-btn.strong { color: var(--amber-ink); border-color: var(--gold); }
.inline-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.inline-opt {
  display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 11px; min-height: 40px; max-width: 100%;
  border-radius: 2px; border: 1px solid #EBC98F; background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s;
}
.inline-opt .io-code { font: 700 11px var(--mono); color: var(--amber-ink); }
.inline-opt .io-title { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.25; }
.inline-opt:not([disabled]):hover { border-color: var(--amber); }
.inline-opt[aria-pressed="true"] { border-color: var(--amber-solid); box-shadow: 0 0 0 1px var(--amber-solid) inset; background: #FFFBEB; }
.inline-opt[aria-pressed="true"] .io-code::before { content: "✓ "; }
.inline-opt[disabled] { opacity: .45; cursor: not-allowed; }

/* animated completion checkbox */
.tick { position: relative; display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; cursor: pointer; }
.tick input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.tick-box { width: 20px; height: 20px; border-radius: 3px; border: 1.5px solid var(--hairline-2); background: var(--surface); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s; }
.tick-box::after { content: ""; width: 9px; height: 5px; margin-top: -2px; border-left: 2.2px solid #fff; border-bottom: 2.2px solid #fff; transform: rotate(-45deg) scale(0); transition: transform .22s cubic-bezier(.3, 1.6, .55, 1); }
.tick:hover .tick-box { border-color: var(--ok); }
.tick input:checked + .tick-box { background: var(--ok); border-color: var(--ok); transform: scale(1.05); }
.tick input:checked + .tick-box::after { transform: rotate(-45deg) scale(1); }
.tick input:focus-visible + .tick-box { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- drawer (tabs) */
.drawer { margin-top: 12px; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.drawer-head { padding: 22px 22px 0; }
.drawer-head h2 { margin: 8px 0 14px; font: 600 34px/1.1 var(--serif); color: var(--ink); }
.drawer-head h2 .slash { color: var(--gold); font-style: italic; }
.tabs { display: flex; border-bottom: 1px solid var(--hairline); padding: 0 12px; overflow-x: auto; scrollbar-width: thin; }
.tab {
  display: inline-flex; align-items: baseline; gap: 8px; border: 0; background: none; padding: 13px 12px 12px; cursor: pointer;
  font: 700 10.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab .idx { font: 700 11px var(--mono); letter-spacing: 0; color: var(--faint); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--crimson); }
.tab[aria-selected="true"] .idx { color: var(--crimson); }
.tab-panel { padding: 22px 22px 26px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
.panel-h { margin: 0 0 10px; font: 600 25px/1.15 var(--serif); color: var(--ink); }
.structure-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 5px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
.structure-row .sbar { grid-column: 1 / -1; height: 4px; background: var(--surface-2); overflow: hidden; }
.structure-row .sbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--crimson), var(--gold)); }
.structure-row .cpv { text-align: right; font: 700 13px var(--mono); }
.structure-total { font-weight: 800; border-bottom: 0; }
.acc-list, .exit-list, .src-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.acc-list li, .exit-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
.src-list li { font-size: 13.5px; padding-left: 16px; position: relative; }
.src-list li::before { content: ""; position: absolute; left: 0; top: .7em; width: 8px; height: 1px; background: var(--gold); }
.status { flex: none; font: 700 9.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
.status-essential { background: var(--crimson-tint); color: var(--crimson); }
.status-major { background: var(--teal-tint); color: var(--teal); }
.status-non { background: var(--surface-2); color: var(--muted); }
.kv { margin: 0 0 14px; font-size: 14px; }
.kv dt { font: 700 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 4px 0 0; }
.cat-filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; margin-bottom: 12px; }
.input { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--hairline-2); border-radius: 2px; background: var(--surface); color: var(--ink); font-size: 14px; }
.check-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
.check-row input { margin-top: 3px; accent-color: var(--crimson); }
.table-scroll { overflow-x: auto; border: 1px solid var(--hairline); max-height: 620px; }
table.cat { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.cat th { position: sticky; top: 0; background: var(--ink); color: #fff; text-align: left; font: 700 9.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; padding: 11px 10px; z-index: 1; }
table.cat td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
table.cat tr.in-plan td { background: var(--gold-tint); }
table.cat td.c-code { font: 700 12.5px var(--mono); white-space: nowrap; color: var(--crimson); }
table.cat td.c-comp { color: var(--muted); font-size: 12.5px; max-width: 260px; }
.cat-count { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

/* ---------- footer (charcoal, as the "A year at WSLSA" band) */
.site-footer { position: relative; overflow: hidden; background-color: var(--ink); background-image: var(--texture); color: #cbc5bc; }
.foot-watermark { position: absolute; left: -70px; bottom: -90px; width: 360px; height: auto; pointer-events: none; }
.foot-inner {
  position: relative; max-width: 1280px; margin: 0 auto; padding-block: 48px 30px; padding-left: var(--gutter); padding-right: var(--gutter-r);
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 36px;
}
.foot-brand { display: flex; gap: 16px; align-items: flex-start; }
.foot-brand .crest-mark { width: 58px; height: 58px; }
.foot-sub { margin: 0; font: italic 500 17px var(--serif); color: var(--gold-soft); }
.foot-name { margin: 0; font: 700 15px/1.25 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.foot-tag { margin: 8px 0 0; font: 700 10px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.foot-col h4 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font: 700 10.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.foot-col h4::before { content: ""; width: 24px; height: 1px; background: currentColor; }
.foot-col p { margin: 0 0 10px; font-size: 13px; line-height: 1.65; }
.foot-links { display: grid; gap: 10px; margin-top: 6px; }
.foot-links a { color: #fff; font: 700 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; text-decoration: none; width: fit-content; border-bottom: 1px solid var(--gold); padding-bottom: 2px; }
.foot-links a:hover { color: var(--gold-soft); }
.foot-base {
  position: relative; max-width: 1280px; margin: 0 auto; padding-block: 16px 24px; padding-left: var(--gutter); padding-right: var(--gutter-r);
  border-top: 1px solid rgba(255, 255, 255, .1); font: 600 10.5px/1.6 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #9b958c;
}
.foot-base i { font-style: normal; color: var(--gold); padding: 0 .4em; }

/* ---------- modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(30, 29, 32, .58); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadein .15s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); color: var(--text); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: min(780px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; border-top: 3px solid var(--crimson); }
.modal-wide { width: min(1340px, 100%); height: calc(100vh - 40px); }
.modal-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--hairline); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-head h2 { margin: 0; font: 600 29px/1.1 var(--serif); color: var(--ink); }
.modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 13.5px; }
.modal-x { border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 8px; }
.modal-x:hover { background: var(--surface-2); color: var(--ink); }
.modal-tools { padding: 12px 20px; display: grid; gap: 10px; border-bottom: 1px solid var(--hairline); background: var(--canvas); }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--hairline-2); background: var(--surface); border-radius: 2px; padding: 6px 11px; font: 700 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; color: var(--muted); min-height: 32px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.modal-body { overflow-y: auto; padding: 8px 12px 14px; flex: 1; min-height: 0; }
.modal-foot { padding: 12px 20px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pick-section h4 { margin: 16px 8px 6px; font: 700 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.pick-list { display: grid; gap: 4px; }
.pick {
  display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%;
  text-align: left; padding: 10px; border-radius: 2px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--text);
}
.pick:hover:not([disabled]) { background: var(--canvas); border-color: var(--hairline); }
.pick[aria-current="true"] { background: var(--gold-tint); border-color: #ecd9a4; }
.pick[disabled] { cursor: not-allowed; opacity: .5; }
.pick .p-code { font: 700 12.5px var(--mono); color: var(--crimson); }
.pick .p-title { font-size: 14px; font-weight: 700; color: var(--ink); }
.pick .p-meta { grid-column: 2 / 3; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.pick .p-side { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.pick-empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 14px; }
.pick-hint { margin: 6px 10px 4px; font-size: 13px; color: var(--muted); }
.pick-best h4 { color: var(--bronze); }
.pick-best .pick { border-color: #ecd9a4; background: var(--gold-tint); }
.status-best { background: var(--gold); color: #fff; }
.pick mark, table.cat mark { background: #FCE7A6; color: inherit; padding: 0 1px; border-radius: 2px; }
table.cat tr.extra td.c-code { color: var(--slate); }
.custom-form { display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 6px 8px 4px; }

/* export options */
.export-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); flex: 1; min-height: 0; }
.export-settings { border-right: 1px solid var(--hairline); padding: 16px 18px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.export-settings fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.export-settings legend { font: 700 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding: 0; }
.opt-card { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 11px 12px; border-radius: 2px; border: 1px solid var(--hairline-2); cursor: pointer; background: var(--surface); }
.opt-card input { margin: 3px 0 0; accent-color: var(--crimson); grid-row: span 2; }
.opt-card b { font-size: 14px; color: var(--ink); }
.opt-card span { font-size: 12.5px; color: var(--muted); }
.opt-card:has(input:checked) { border-color: var(--crimson); box-shadow: 0 0 0 1px var(--crimson) inset; background: var(--crimson-tint); }
.export-preview { background: #E7E1D8; overflow: auto; padding: 18px; position: relative; }
.preview-stage { transform-origin: top left; }
.preview-meta { position: sticky; top: -18px; margin: -18px -18px 14px; padding: 8px 18px; background: rgba(231, 225, 216, .94); font-size: 12.5px; color: var(--muted); z-index: 2; display: flex; justify-content: space-between; gap: 12px; }
.export-help { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; }
.export-help b { color: var(--text); }

/* toast */
#toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 2px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg); border-left: 3px solid var(--gold); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- responsive */
@media (max-width: 1180px) {
  .dock-card { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  .dock-card .progress { grid-column: span 2; }
  .hero-seal { width: 150px; height: 150px; }
}
@media (max-width: 980px) {
  .top-link { display: none; }
  .foot-inner { grid-template-columns: 1fr 1fr; }
  .foot-brand { grid-column: 1 / -1; }
  .cat-filters { grid-template-columns: 1fr 1fr; }
  .export-layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(320px, 1fr); }
  .export-settings { border-right: 0; border-bottom: 1px solid var(--hairline); max-height: 42vh; }
}
@media (max-width: 900px) {
  .dock { position: static; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  html { scroll-padding-top: 16px; }
  .subj { scroll-margin-top: 16px; }
  .two-col { grid-template-columns: 1fr; }
  .hero-seal { display: none; }
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  :root { --gutter: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar-inner { flex-wrap: wrap; gap: 8px; }
  .top-actions { width: 100%; justify-content: flex-start; gap: 0; }
  .tbtn { padding: 8px 10px; letter-spacing: .12em; min-height: 36px; }
  .hero-grid { padding-block: 26px 24px; }
  .hero-band .kicker::before { width: 20px; }
  .crest-text { font-size: 13.5px; }
  .dock-card { grid-template-columns: 1fr; }
  .dock-card .progress { grid-column: auto; }
  .ribbon { display: grid; grid-template-columns: 1fr 1fr; }
  .ribbon > div { padding: 12px 14px; border-right: 0; border-bottom: 1px solid var(--hairline); }
  .ribbon > div:nth-child(odd) { border-right: 1px solid var(--hairline); }
  .ribbon > div:last-child { grid-column: 1 / -1; margin-left: 0; border-bottom: 0; border-right: 0; }
  .advisory > summary { flex-wrap: wrap; gap: 6px 10px; }
  .adv-counts { flex-basis: 100%; order: 3; }
  .adv-body { grid-template-columns: 1fr; }
  .sessions { grid-template-columns: 1fr; }
  .session + .session { border-left: 0; border-top: 1px solid var(--hairline); }
  .year-bar h2 { font-size: 26px; }
  .year-bar::after { font-size: 80px; }
  .subj { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "lead side" "main main"; }
  .subj-lead { grid-area: lead; }
  .subj-side { grid-area: side; flex-direction: row-reverse; align-items: center; justify-content: flex-start; flex-wrap: wrap; }
  .subj-main { grid-area: main; }
  .pills { justify-content: flex-start; }
  .foot-inner { grid-template-columns: 1fr; }
  .cat-filters, .custom-form { grid-template-columns: 1fr; }
  .pick { grid-template-columns: 82px minmax(0, 1fr); }

<script>
/* WSLSA 2027 Degree Pathway Explorer.
   All data comes from the embedded JSON payload built by scripts/build_app.py from the WSLSA 2027
   Degree Guides workbook. No network calls; state lives in localStorage and the URL hash. */
(function () {
  'use strict';

  // ======================================================================== data
  const $ = (sel, root) => (root || document).querySelector(sel);
  const RAW = JSON.parse($('#wslsa-data').textContent);
  const META = RAW.meta;
  const CAMPUS_NAMES = Object.assign({}, META.campuses, { TBC: 'Session not yet published for 2027' });
  const PRIMARY_CAMPUSES = ['PS', 'CA', 'PC', 'HA', 'BC', 'PE', 'LC'];
  const SESSIONS = ['Autumn', 'Spring'];
  const LOAD_CP = { FT: 40, PT: 20 };

  const DEG = {};
  const GLOBAL_BY_CODE = {}; // every subject in the workbook, across all degrees
  const DEGREES = RAW.degrees.map(function (d) {
    d.catalogue = d.catalogue.map(function (r) {
      return { component: r[0], level: r[1], code: r[2], title: r[3], autumn: r[4], spring: r[5], cp: r[6], source: r[7] };
    });
    d.byCode = {};
    d.byComp = {};
    d.components = [];
    d.catalogue.forEach(function (c) {
      if (!d.byCode[c.code]) d.byCode[c.code] = c;
      if (!d.byComp[c.component]) { d.byComp[c.component] = []; d.components.push(c.component); }
      d.byComp[c.component].push(c);
    });
    d.llbComponent = d.components.find(function (c) { return c.indexOf('LLB Alternate') === 0; });
    d.catalogue.forEach(function (c) { if (!GLOBAL_BY_CODE[c.code]) GLOBAL_BY_CODE[c.code] = c; });
    DEG[d.code] = d;
    return d;
  });

  const OPT = {};
  RAW.options.forEach(function (o) { OPT[o.pathwayKey] = o; });

  const PATH = {};
  Object.keys(RAW.pathways).forEach(function (key) {
    PATH[key] = RAW.pathways[key].map(function (r) {
      return {
        year: r[0], session: r[1] === 'A' ? 'Autumn' : 'Spring', slot: r[2], code: r[3], title: r[4], type: r[5],
        offered: r[6], cp: r[7], notes: r[8], kind: r[9], pool: r[10] || null,
        options: r[11] ? r[11].map(function (o) { return { code: o[0], title: o[1], tbcFlag: o[2] }; }) : null,
        id: r[0] + r[1] + r[2],
      };
    });
  });

  // Additional WSU subjects from the subject list: selectable in elective slots ("any WSU subject") and
  // searchable in the catalogue. The list has codes and titles only, with no session, campus or CP data.
  const EXTRA = (RAW.extra || []).map(function (r) { return { code: r[0], title: r[1], level: 'Level ' + r[0].charAt(5), lv: +r[0].charAt(5), list: true }; });
  const EXTRA_BY_CODE = {};
  EXTRA.forEach(function (e) { EXTRA_BY_CODE[e.code] = e; });
  const PICK_LIMIT = 60;
  // Elective slots take any WSU subject: every workbook subject (with its 2027 sessions) plus the subject list.
  const ANY_SUBJECTS = Object.keys(GLOBAL_BY_CODE).map(function (code) {
    const c = GLOBAL_BY_CODE[code];
    return { code: code, title: c.title, level: c.level || 'Level ' + code.charAt(5), lv: +code.charAt(5), handbook: true };
  }).concat(EXTRA).sort(function (a, b) { return a.code < b.code ? -1 : 1; });

  // ======================================================================== helpers
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseOffered(v) {
    let s = (v || '').trim();
    const info = { codes: [], tbc: false, y2026: false, none: false };
    if (!s || s === '—' || s === '-') { info.none = true; return info; }
    if (s.indexOf('(2026)') >= 0) { info.y2026 = true; s = s.replace('(2026)', '').trim(); }
    if (s === 'TBC') { info.tbc = true; return info; }
    info.codes = s.split(/\s+/);
    return info;
  }
  function sessionValue(entry, session) { return session === 'Autumn' ? entry.autumn : entry.spring; }
  function offerFor(deg, code, session) {
    const e = deg.byCode[code] || GLOBAL_BY_CODE[code];
    if (!e) return null;
    const info = parseOffered(sessionValue(e, session));
    if (e.source && /^2026/.test(e.source)) info.y2026 = true;
    return info;
  }
  function orderIdx(y, s) { return (y - 1) * 2 + (s === 'Spring' ? 1 : 0); }
  function where(s) { return 'Year ' + s.year + ' ' + s.session; }
  function fmt(n) { return String(Math.round(n * 10) / 10); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  // ---- subject search: matches a code (with or without the space) or words in the title, in any
  // order, and ranks the exact or most relevant subject first; tolerates a one-letter typo in longer words
  function normQ(q) { return String(q || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function qTokens(q) { return normQ(q).split(' ').map(function (t) { return t.replace(/[^a-z0-9]/g, ''); }).filter(Boolean); }
  function normCode(v) {
    const c = String(v || '').toUpperCase().replace(/[\s-]+/g, '');
    return /^[A-Z]{4}\d{4}$/.test(c) ? c.slice(0, 4) + ' ' + c.slice(4) : '';
  }
  function within1(a, b) {
    if (a === b) return true;
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0;
    let j = 0;
    let edits = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (a.length > b.length) i++;
      else if (b.length > a.length) j++;
      else { i++; j++; }
    }
    return edits + (a.length - i) + (b.length - j) <= 1;
  }
  function searchScore(e, q) {
    const nq = normQ(q);
    if (!nq) return 1;
    const code = e.code.toLowerCase().replace(' ', '');
    const qc = nq.replace(/[\s-]+/g, '');
    const title = e.title.toLowerCase();
    if (code === qc) return 1000;
    if (title === nq) return 950;
    let best = 0;
    if (qc.length >= 2 && code.indexOf(qc) === 0) best = 800 - (code.length - qc.length);
    if (title.indexOf(nq) === 0) best = Math.max(best, 720);
    else if (nq.length >= 3 && title.indexOf(nq) > 0) best = Math.max(best, 620);
    const words = title.split(/[^a-z0-9]+/).filter(Boolean);
    const toks = qTokens(nq);
    let sum = 0;
    let strong = true; // every word matched a whole word, the start of a word, or the code
    for (let k = 0; k < toks.length; k++) {
      const t = toks[k];
      if (words.indexOf(t) >= 0) sum += 60;
      else if (words.some(function (w) { return w.indexOf(t) === 0; })) sum += 45;
      else if (code.indexOf(t) >= 0) sum += 40;
      else if (title.indexOf(t) >= 0) { sum += 25; strong = false; }
      else if (t.length >= 4 && words.some(function (w) { return within1(w, t) || (w.length > t.length && within1(w.slice(0, t.length), t)); })) { sum += 12; strong = false; }
      else return best; // a word that matches nothing: only whole-phrase matches can still count
    }
    const wordScore = strong ? 640 + Math.min(sum, 100) : Math.min(sum, 590);
    return Math.max(best, wordScore) - e.title.length / 1000;
  }
  function rankByQuery(list, q) {
    if (!normQ(q)) return list.slice();
    return list.map(function (x) { return [x, searchScore(x, q)]; })
      .filter(function (r) { return r[1] > 0; })
      .sort(function (a, b) { return b[1] - a[1] || (a[0].code < b[0].code ? -1 : 1); })
      .map(function (r) { return r[0]; });
  }
  // wraps the parts of a title that match the search in <mark>, escaping everything else
  function hl(text, q) {
    const toks = qTokens(q).filter(function (t) { return t.length >= 2; });
    if (!toks.length) return esc(text);
    const low = text.toLowerCase();
    const ranges = [];
    const add = function (needle) {
      let i = low.indexOf(needle);

      majorField = '<div class="select-wrap"><select id="sel-major" aria-label="Major or minor">' + inner + '</select></div>';
    }
    const home = deg.campusList.map(function (n) { return Object.keys(META.campuses).find(function (c) { return META.campuses[c] === n; }); }).filter(Boolean);
    const others = PRIMARY_CAMPUSES.filter(function (c) { return home.indexOf(c) < 0; });
    const campOpt = function (c) { return '<option value="' + c + '"' + (state.campus === c ? ' selected' : '') + '>' + c + ' · ' + esc(META.campuses[c]) + '</option>'; };
    const campusSelect = '<div class="select-wrap"><select id="sel-campus" aria-label="Highlight a campus">' +
      '<option value="">All campuses</option>' +
      '<optgroup label="This degree\'s campuses">' + home.map(campOpt).join('') + '</optgroup>' +
      '<optgroup label="Other campuses">' + others.map(campOpt).join('') + '</optgroup></select></div>';
    const load = '<div class="segmented" role="group" aria-label="Enrolment load">' +
      '<button type="button" data-action="load" data-load="FT" aria-pressed="' + (state.load === 'FT') + '" title="40 CP per session">Full-time</button>' +
      '<button type="button" data-action="load" data-load="PT" aria-pressed="' + (state.load === 'PT') + '" title="20 CP per session (indicative)">Part-time</button></div>';

    const total = deg.cp;
    const done = ctx.doneCP;
    const remaining = Math.max(total - done, 0);
    const per = LOAD_CP[state.load];
    const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;
    const progress = '<div class="progress"><div class="progress-top"><span class="field-label">Progress</span>' +
      '<span class="progress-num" id="progress-num">' + done + ' / ' + total + ' <small>CP</small></span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '" aria-label="Credit points completed"><span style="width:' + pct + '%"></span></div>' +
      '<div class="progress-meta">' + (remaining ? remaining + ' CP to go · ≈ ' + plural(Math.ceil(remaining / per), 'session') + ' ' + (state.load === 'FT' ? 'FT' : 'PT') : 'All ' + total + ' CP complete') + '</div></div>';

    $('#dock').innerHTML =
      '<div class="field"><label for="sel-degree">Degree</label>' + degSelect + '</div>' +
      '<div class="field">' + (deg.fixedStructure ? '<span class="field-label">Major / minor</span>' : '<label for="sel-major">Major / minor</label>') + majorField + '</div>' +
      '<div class="field"><label for="sel-campus">Campus highlight</label>' + campusSelect + '</div>' +
      '<div class="field"><span class="field-label">Load</span>' + load + '</div>' + progress;
  }

  function renderFacts(ctx) {
    const d = ctx.deg;
    const item = function (label, value, cls) { return '<div><span class="rb-l">' + label + '</span><span class="rb-v' + (cls ? ' ' + cls : '') + '">' + value + '</span></div>'; };
    $('#facts').innerHTML =
      item('Credit points', d.cp + ' CP', 'big') +
      item('Duration', fmt(d.ftYears) + ' yrs full-time <small>· ' + fmt(d.ptYears) + ' part-time</small>') +
      item('Intake', esc(d.intake) + (d.intakeList.length === 1 ? ' <small>only</small>' : '')) +
      item('Campuses', esc(d.campuses)) +
      '<div><a class="tbtn tbtn-outline handbook" href="' + esc(d.handbook) + '" target="_blank" rel="noopener">Official 2027 Handbook →</a></div>';
  }

  function renderAdvisory(ctx) {
    const r = ctx.risks;
    const sev = r.advisor.length ? 'adv-crit' : (r.tbc.length || r.campus.length || r.notOffered.length) ? 'adv-warn' : 'adv-ok';
    const parts = [];
    if (r.advisor.length) parts.push('<b>' + plural(r.advisor.length, 'prerequisite note') + '</b>');
    if (r.tbc.length) parts.push('<b>' + r.tbc.length + '</b> ' + (r.tbc.length === 1 ? 'subject has' : 'subjects have') + ' 2027 sessions TBC');
    if (r.pending.length) parts.push('<b>' + r.pending.length + '</b> ' + (r.pending.length === 1 ? 'choice' : 'choices') + ' still open');
    if (state.campus && r.campus.length) parts.push('<b>' + r.campus.length + '</b> not at ' + esc(META.campuses[state.campus]) + ' or online');
    if (r.y2026.length) parts.push(r.y2026.length + ' using 2026 session data');
    if (!parts.length) parts.push('Nothing flagged for this selection');

    const secs = [];
    secs.push('<section class="adv-sec" id="risk-advisor"><h3><span class="idx">01→</span>Prerequisite notes</h3>' + (r.advisor.length ? '<ul>' + r.advisor.map(function (a) {
      const scope = a.applies
        ? '<span class="note-scope">' + (a.note.major ? 'Applies to your ' + esc(a.note.majorKind.replace('Testamur ', '').toLowerCase()) : 'Applies to this degree') + '</span>'
        : '<span class="note-scope related">Flagged for the ' + esc(a.note.major) + ' ' + esc(a.note.majorKind.replace('Testamur ', '').toLowerCase()) + '; ' + esc(a.note.subject) + ' is also in your pathway</span>';
      return '<li>' + scope + (a.flagSlot ? '<button type="button" class="where" data-action="jump" data-slot="' + a.flagSlot.id + '">' + where(a.flagSlot) + '</button>' : '<span class="where">Not in your plan</span>') +
        esc(a.note.text) + (a.hint ? '<span class="hint">' + (a.resolvedByChoice ? '<b>Your choice helps:</b> ' : '<b>From your plan:</b> ') + esc(a.hint) + '</span>' : '') + '</li>';
    }).join('') + '</ul>' : '<p>The workbook flags no prerequisite gaps for this selection.</p>') + '</section>');
    if (r.tbc.length) {
      secs.push('<section class="adv-sec" id="risk-tbc"><h3><span class="idx">02→</span>2027 sessions TBC</h3>' +
        '<p>WSLSA placed these subjects in the session shown, but WSU has not published their 2027 offering yet. Check the <a href="' + esc(ctx.deg.handbook) + '" target="_blank" rel="noopener">2027 Handbook →</a> closer to enrolment.</p>' +
        '<div class="chiplist">' + r.tbc.map(function (s) {
          return '<button type="button" class="chipbtn" data-action="jump" data-slot="' + s.id + '"><code>' + esc(s.code) + '</code>' + esc(s.title) + ' <span>' + where(s) + (s.chosen ? ' · your choice' : '') + '</span></button>';
        }).join('') + '</div></section>');
    }
    const checks = [];
    if (state.campus && r.campus.length) checks.push('<p><b>Not at ' + esc(META.campuses[state.campus]) + ' or online:</b> ' + r.campus.map(function (s) { return '<button type="button" class="linkish" data-action="jump" data-slot="' + s.id + '">' + esc(s.code) + '</button> (' + s.offer.codes.join(' ') + ', ' + where(s) + ')'; }).join('; ') + '.</p>');
    if (state.campus && r.onlineOnly.length) checks.push('<p><b>Online only for you:</b> ' + r.onlineOnly.map(function (s) { return esc(s.code); }).join(', ') + '.</p>');
    if (r.y2026.length) checks.push('<p><b>2026 session data shown:</b> ' + r.y2026.map(function (s) { return esc(s.code) + ' ' + esc(s.title) + ' (' + where(s) + ')'; }).join('; ') + '.</p>');
    if (r.notOffered.length) checks.push('<p><b>Not offered in the planned session:</b> ' + r.notOffered.map(function (s) { return esc(s.code) + ' (' + where(s) + ')'; }).join('; ') + '.</p>');
    if (r.unlisted.length) checks.push('<p><b>Check sessions in the Handbook:</b> ' + r.unlisted.map(function (s) { return '<button type="button" class="linkish" data-action="jump" data-slot="' + s.id + '">' + esc(s.code) + '</button> (' + where(s) + ')'; }).join(', ') + '. The WSU subject list has no session or campus data, so confirm these electives run in the session shown.</p>');
    if (r.pending.length) checks.push('<p><b>Still to choose:</b> ' + r.pending.map(function (s) { return '<button type="button" class="linkish" data-action="jump" data-slot="' + s.id + '">' + where(s) + '</button>'; }).join(', ') + '.</p>');
    if (checks.length) secs.push('<section class="adv-sec"><h3><span class="idx">' + (r.tbc.length ? '03' : '02') + '→</span>Campus &amp; choice checks</h3>' + checks.join('') + '</section>');

    $('#advisory').innerHTML = '<details class="advisory ' + sev + '" id="advisory-box"' + (ui.advisoryOpen ? ' open' : '') + '>' +
      '<summary>' + ALERT_ICON + '<span class="adv-label">Pathway Advisory</span><span class="adv-counts">' + parts.join(' · ') + '</span><span class="adv-cta">View details</span></summary>' +
      '<div class="adv-body">' + secs.join('') + '</div></details>';
  }

  function renderLegend() {
    const types = [['law', 'Law core', '--crimson'], ['nonlaw', 'Non-law core', '--slate'], ['major', 'Major / minor', '--teal']];
    $('#legend').innerHTML =
      '<div class="lg-group"><span class="lg-title">Unit type</span>' + types.map(function (t) {
        return '<span class="lg-sw"><i style="--k:var(' + t[2] + ')"></i>' + t[1] + '</span>';
      }).join('') + '<span class="lg-sw slot"><i></i>Your choice (LLB Alternate, choice, elective)</span></div>' +
      '<span class="lg-sep" aria-hidden="true"></span>' +
      '<div class="lg-group"><span class="lg-title">Campus</span>' + Object.keys(META.campuses).map(function (c) {
        return '<span class="lg-camp">' + pill(c, { focus: true }) + esc(META.campuses[c].replace(' (Kingswood)', '')) + '</span>';
      }).join('') + '<span class="lg-camp">' + pill('TBC', { focus: true }) + 'Not yet published</span>' +
      (state.campus ? '<button type="button" class="linkish small" data-action="campus-clear">Clear highlight</button>' : '') + '</div>';
  }

  function selectLabel(s) {
    if (s.kind === 'llb') return 'Select LLB Alternate';
    if (s.kind === 'elective') return 'Select Elective';
    return 'Select Subject';
  }
  function slotHTML(s, ctx) {
    const kc = kindClass(s);
    const cls = ['subj', kc];
    if (kc === 'k-slot') cls.push(s.pending ? 'is-pending' : 'is-chosen');
    if (s.done) cls.push('is-done');
    const offCampus = state.campus && ctx.risks.campus.indexOf(s) >= 0;
    if (offCampus) cls.push('offcampus');
    const flags = [];
    if (s.done) flags.push('<span class="flag flag-done">✓ Completed</span>');
    if (s.offer && s.offer.tbc) flags.push('<span class="flag flag-tbc" title="2027 session not yet published">Session TBC</span>');
    if (s.offer && s.offer.y2026 && !s.offer.tbc) flags.push('<span class="flag flag-2026" title="2027 session not yet published; 2026 session shown">2026 data</span>');
    if (s.chosen) flags.push('<span class="flag flag-chosen">Your choice</span>');
    if (s.custom) flags.push('<span class="flag flag-chosen">Custom</span>');
    if (s.listSubject) flags.push('<span class="flag flag-2026" title="Added from the WSU subject list">WSU subject list</span>');
    if (offCampus) flags.push('<span class="flag flag-campus">Not at ' + state.campus + '</span>');
    if (ctx.risks.advisor.some(function (a) { return a.flagSlot === s; })) flags.push('<button type="button" class="flag flag-warn" data-action="open-advisory">Check prerequisite</button>');
    if (s.offer && s.offer.none && !s.pending) flags.push('<span class="flag flag-warn">Not offered this session</span>');

    let body = '';
    if (s.pending && s.kind === 'llb') body += '<div class="subj-note">Any LLB Alternate offered in ' + s.session + ' 2027.</div>';
    if (s.kind === 'inline' && s.raw.options.length > 1) {
      body += '<div class="inline-opts" role="group" aria-label="Choose one">' + s.raw.options.map(function (o) {
        const sel = s.code === o.code && !s.pending;
        const clash = !sel && usedElsewhere(ctx, o.code, s.id);
        const off = offerFor(ctx.deg, o.code, s.session);
        const tip = clash ? 'Already in your plan' : (off && off.codes.length ? 'Offered ' + s.session + ': ' + off.codes.join(' ') : (o.tbcFlag || (off && off.tbc) ? 'Session TBC' : ''));
        return '<button type="button" class="inline-opt" data-action="inline" data-slot="' + s.id + '" data-code="' + esc(o.code) + '" aria-pressed="' + sel + '"' + (clash ? ' disabled' : '') + ' title="' + esc(tip) + '">' +
          '<span class="io-code">' + esc(o.code) + (o.tbcFlag ? ' · TBC' : '') + '</span><span class="io-title">' + esc(o.title) + '</span></button>';
      }).join('') + '</div>';
      if (s.chosen) body += '<div class="subj-actions"><button type="button" class="text-btn" data-action="clear" data-slot="' + s.id + '">Clear choice</button></div>';
    } else if (s.kind === 'inline' && s.auto) {
      body += '<div class="subj-note">Only option listed for this ' + s.session + ' slot.</div>';
    }
    if (s.kind === 'llb' || s.kind === 'pool' || s.kind === 'elective') {
      body += s.pending
        ? '<div class="subj-actions"><button type="button" class="select-btn" data-action="picker-open" data-slot="' + s.id + '">+ ' + selectLabel(s) + ' →</button></div>'
        : '<div class="subj-actions"><button type="button" class="text-btn strong" data-action="picker-open" data-slot="' + s.id + '">Change subject →</button><button type="button" class="text-btn" data-action="clear" data-slot="' + s.id + '">Clear</button></div>';
    } else if (s.kind === 'option') {
      body += '<div class="subj-actions"><button type="button" class="text-btn strong" data-action="picker-open" data-slot="' + s.id + '">Swap option →</button>' +
        (s.pick ? '<button type="button" class="text-btn" data-action="clear" data-slot="' + s.id + '">Reset to WSLSA pick</button>' : '') + '</div>';
    }
    if (s.kind === 'fixed' && s.cp === 0) body += '<div class="subj-note">0 CP placement or requirement</div>';

    const codeTxt = s.pending ? (s.kind === 'llb' ? 'LLB ALT' : s.kind === 'elective' ? 'ELECTIVE' : 'CHOICE') : s.code;
    const check = '<label class="tick" title="Mark complete"><input type="checkbox" data-action="done" data-slot="' + s.id + '"' + (s.done ? ' checked' : '') + ' aria-label="Mark ' + esc((s.pending ? '' : s.code + ' ') + s.title) + ' complete"><span class="tick-box" aria-hidden="true"></span></label>';
    return '<div class="' + cls.join(' ') + '" id="slot-' + s.id + '" data-slot="' + s.id + '">' +
      '<div class="subj-lead">' + check + '<span class="code-pill">' + esc(codeTxt) + '</span></div>' +
      '<div class="subj-main"><div class="subj-title">' + esc(s.title) + '</div><div class="subj-meta"><span class="cat">' + esc(s.typeLabel) + '</span>' + flags.join('') + '</div>' + body + '</div>' +
      '<div class="subj-side"><span class="pills">' + (s.pending ? '' : s.listSubject ? '<span class="muted small" title="The WSU subject list has no session or campus data">Check Handbook</span>' : pillsFor(s.offer)) + '</span><span class="cp-badge">' + s.cp + ' CP</span></div></div>';
  }

  function sortSlots(list) {
    return list.slice().sort(function (a, b) { return orderIdx(a.year, a.session) - orderIdx(b.year, b.session) || a.raw.slot - b.raw.slot; });
  }
  function sumCP(list, doneOnly) { return list.reduce(function (a, s) { return a + (!doneOnly || s.done ? s.cp : 0); }, 0); }

  function renderGrid(ctx) {
    const years = timeline(ctx, state.load);
    const pt = state.load === 'PT';
    let html = pt ? '<p class="pt-note"><b>Part-time view (indicative).</b> Each full-time session is split into two 20 CP sessions, keeping every subject in the session type it is offered in. This lengthens the pathway to about ' + fmt(ctx.deg.ptYears) + ' years and can shift prerequisite timing, so confirm your sequence with the Academic Program Advisor.</p>' : '';
    years.forEach(function (y) {
      const lists = { Autumn: sortSlots(y.Autumn), Spring: sortSlots(y.Spring) };
      const all = lists.Autumn.concat(lists.Spring);
      const R = roman(y.year);
      html += '<article class="year" id="year-' + y.year + '" aria-label="Year ' + y.year + '">' +
        '<header class="year-bar" data-roman="' + R + '"><span class="year-seal" aria-hidden="true">' + R + '</span>' +
        '<h2>Year ' + y.year + (pt ? '<small>Part-time</small>' : '') + '</h2>' +
        '<div class="year-cp"><b>' + sumCP(lists.Autumn) + ' CP</b> Autumn · <b>' + sumCP(lists.Spring) + ' CP</b> Spring<span class="done">' + sumCP(all, true) + ' / ' + sumCP(all) + ' CP completed</span></div></header>' +
        '<div class="sessions">';
      SESSIONS.forEach(function (sess) {
        const list = lists[sess];
        const allDone = list.length && list.every(function (s) { return s.done; });
        html += '<section class="session" aria-label="' + sess + ' session"><div class="session-head"><h3>' + sess + '<span>Session</span></h3><div class="session-tools">' +
          (list.length ? '<button type="button" class="mark-all" data-action="session-done" data-ids="' + list.map(function (s) { return s.id; }).join(',') + '">' + (allDone ? 'Unmark all' : 'Mark all done') + '</button>' : '') +
          '<span class="session-cp">' + sumCP(list) + ' CP</span></div></div><div class="slots">' +
          (list.length ? list.map(function (s) { return slotHTML(s, ctx); }).join('') : '<div class="slot-empty">No subjects scheduled this session</div>') + '</div></section>';
      });
      html += '</div></article>';
    });
    $('#grid').innerHTML = html;
  }

  function statusClass(st) {
    if (!st) return 'status-non';
    if (/^Essential/.test(st)) return 'status-essential';
    if (/Relates to Major/.test(st)) return 'status-major';
    return 'status-non';
  }

  const TABS = [
    ['structure', '01→', 'Program Structure & Credit Breakdown'],
    ['admission', '02→', 'Admission, LPAB Accreditation & Exit Awards'],
    ['catalogue', '03→', 'Full 2027 Subject & LLB Alternate Catalogue'],
  ];
  function renderDetails(ctx) {
    const d = ctx.deg;
    let html = '<div class="drawer-head"><p class="kicker">Degree details <i>·</i> 2027 Student Handbook</p><h2>Inside ' + titleHTML(d.title) + '</h2></div>' +
      '<div class="tabs" role="tablist">' + TABS.map(function (t) {
        return '<button type="button" class="tab" role="tab" id="tab-' + t[0] + '" data-action="tab" data-tab="' + t[0] + '" aria-selected="' + (ui.tab === t[0]) + '"><span class="idx">' + t[1] + '</span>' + esc(t[2]) + '</button>';
      }).join('') + '</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-' + ui.tab + '">';
    if (ui.tab === 'structure') {
      const max = Math.max.apply(null, d.structure.map(function (c) { return c.cp; }));
      const c = META.counts;
      html += '<div class="two-col"><div><h3 class="panel-h">Credit breakdown</h3>' +
        d.structure.map(function (c) {
          return '<div class="structure-row"><span>' + esc(c.component) + '</span><span class="cpv">' + c.cp + ' CP</span><span class="sbar"><span style="width:' + (c.cp / max * 100) + '%"></span></span></div>';
        }).join('') +
        '<div class="structure-row structure-total"><span>Total credit points</span><span class="cpv">' + d.structureTotal + ' CP</span></div>' +
        '<dl class="kv" style="margin-top:18px"><dt>Major / minor choices</dt><dd>' + esc(d.majorChoices) + ' · ' + plural(d.pathwayGroups, 'pathway group') + '</dd></dl>' +
        '<dl class="kv"><dt>Duration</dt><dd>' + fmt(d.ftYears) + ' years full-time · ' + fmt(d.ptYears) + ' years part-time</dd></dl></div>' +
        '<div><h3 class="panel-h">How the pathway is built</h3><p class="small muted" style="margin-top:0">' + esc(d.sheetIntro) + '</p>' +
        '<h3 class="panel-h" style="margin-top:18px">Advisor notes for ' + d.code + '</h3>' +
        (d.advisorNotes.length ? '<ul class="src-list">' + d.advisorNotes.map(function (n) { return '<li>' + esc(n.text) + '</li>'; }).join('') + '</ul>' : '<p class="muted small">The workbook lists no advisor notes for this degree.</p>') +
        '<p class="small muted" style="margin-top:14px">Source: ' + esc(META.sourceWorkbook) + ' (' + c.pathwayRows.toLocaleString('en-AU') + ' pathway slots, ' + c.catalogueRows.toLocaleString('en-AU') + ' catalogue rows across ' + c.degrees + ' degrees)' + (EXTRA.length ? ', plus ' + EXTRA.length.toLocaleString('en-AU') + ' more subjects from the WSU subject list for any-subject electives' : '') + '. Subjects with sessions TBC in this degree: ' + esc(d.tbcSubjects.join(', ')) + '.</p></div></div>';
    } else if (ui.tab === 'admission') {
      html += '<div class="two-col"><div><h3 class="panel-h">Admission</h3>' +
        '<dl class="kv"><dt>Assumed knowledge / admission</dt><dd>' + esc(d.assumedKnowledge) + '</dd></dl>' +
        '<dl class="kv"><dt>Intake</dt><dd>' + esc(d.intake) + '</dd></dl>' +
        '<dl class="kv"><dt>Campuses</dt><dd>' + esc(d.campuses) + '</dd></dl>' +
        '<dl class="kv"><dt>Students</dt><dd>' + esc(d.students) + (d.cricos ? ' · CRICOS ' + esc(d.cricos) : '') + '</dd></dl>' +
        '<h3 class="panel-h" style="margin-top:20px">Exit awards</h3><ul class="exit-list">' + d.exitAwards.map(function (e) {
          return '<li><span>' + (e.code ? '<b class="mono">' + e.code + '</b> ' : '') + esc(e.name) + '</span>' + (e.exitOnly ? '<span class="status status-non">Exit only</span>' : '') + '</li>';
        }).join('') + '</ul></div>' +
        '<div><h3 class="panel-h">LPAB &amp; professional accreditation</h3><ul class="acc-list">' + d.accreditation.map(function (a) {
          return '<li><span>' + esc(a.name) + '</span><span class="status ' + statusClass(a.status) + '">' + esc(a.status || '') + '</span></li>';
        }).join('') + '</ul></div></div>';
    } else {
      html += '<p class="cat-count">' + esc(d.catalogueNote || '') + '</p>' +
        '<div class="cat-filters">' +
        '<div class="field"><label for="cat-q">Search</label><input class="input" id="cat-q" type="search" placeholder="Code or title, e.g. LAWS 4008 or Revenue" value="' + esc(ui.cat.q) + '"></div>' +
        '<div class="field"><label for="cat-comp">Component</label><div class="select-wrap"><select id="cat-comp"><option value="">All components</option>' + d.components.map(function (c) { return '<option' + (ui.cat.comp === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
          (EXTRA.length ? '<option value="__extra__"' + (ui.cat.comp === '__extra__' ? ' selected' : '') + '>WSU subject list (' + EXTRA.length.toLocaleString('en-AU') + ' more subjects)</option>' : '') + '</select></div></div>' +
        '<div class="field"><label for="cat-session">Session</label><div class="select-wrap"><select id="cat-session"><option value="">Autumn or Spring</option><option value="Autumn"' + (ui.cat.session === 'Autumn' ? ' selected' : '') + '>Offered in Autumn</option><option value="Spring"' + (ui.cat.session === 'Spring' ? ' selected' : '') + '>Offered in Spring</option><option value="TBC"' + (ui.cat.session === 'TBC' ? ' selected' : '') + '>Session TBC</option></select></div></div>' +
        '<label class="check-row" style="padding-bottom:10px"><input type="checkbox" id="cat-inplan"' + (ui.cat.inPlan ? ' checked' : '') + '>In my plan</label>' +
        '</div><div id="cat-results"></div>';
    }
    html += '</div>';
    $('#details').innerHTML = html;
    if (ui.tab === 'catalogue') renderCatalogueRows(ctx);

  // ======================================================================== mutations
  function setPick(slotId, pick) {
    const key = currentKey();
    state.picks[key] = state.picks[key] || {};
    if (pick) state.picks[key][slotId] = pick; else delete state.picks[key][slotId];
    if (!Object.keys(state.picks[key]).length) delete state.picks[key];
  }
  function setMajor(newKey) {
    const prev = currentKey();
    state.majorFor[state.degree] = newKey;
    // carry LLB alternate and elective picks into the new pathway where the same slot is still free
    const prevPicks = state.picks[prev] || {};
    PATH[newKey].forEach(function (raw) {
      const oldRaw = PATH[prev].find(function (r) { return r.id === raw.id; });
      const p = prevPicks[raw.id];
      if (!p || !oldRaw || oldRaw.kind !== raw.kind || (raw.kind !== 'llb' && raw.kind !== 'elective')) return;
      state.picks[newKey] = state.picks[newKey] || {};
      if (!state.picks[newKey][raw.id]) state.picks[newKey][raw.id] = p;
    });
  }

  function renderPickerResults() {
    const ctx = lastCtx;
    const s = ctx.byId[ui.picker.slotId];
    const p = ui.picker;
    const q = normQ(p.q);
    const groups = { offered: [], tbc: [], off: [] };
    let hiddenByCampus = 0;
    rankByQuery(poolEntries(ctx, s.raw), q).forEach(function (e) {
      if (p.level && e.level !== p.level) return;
      const off = offerFor(ctx.deg, e.code, s.session);
      if (off.tbc) groups.tbc.push({ e: e, off: off });
      else if (off.none) groups.off.push({ e: e, off: off });
      else {
        if (p.campusOnly && state.campus && off.codes.indexOf(state.campus) < 0 && off.codes.indexOf('ON') < 0) { hiddenByCampus++; return; }
        groups.offered.push({ e: e, off: off });
      }
    });
    // elective slots also search the WSU subject list
    const listOn = s.kind === 'elective' && EXTRA.length > 0;
    const shownCodes = {};
    if (listOn) poolEntries(ctx, s.raw).forEach(function (e) { shownCodes[e.code] = 1; });
    const listPool = listOn ? ANY_SUBJECTS.filter(function (e) { return !shownCodes[e.code] && (!p.ugOnly || (e.lv >= 1 && e.lv <= 4)) && (!p.level || e.level === p.level); }) : [];
    const listHits = listOn && q.length >= 2 ? rankByQuery(listPool, q) : [];
    // the single most relevant subject across every list is pinned to the top
    // labelled only when it is an exact code or title match, or clearly ahead of the next result
    let best = null;
    if (q.length >= 2) {
      const cands = groups.offered.concat(groups.tbc).map(function (i) { return { src: 'pool', item: i, e: i.e, score: searchScore(i.e, q) }; });
      // an exact match that does not run this session is still surfaced, so students learn why
      groups.off.forEach(function (i) { const sc = searchScore(i.e, q); if (sc >= 950) cands.push({ src: 'pool', off: true, item: i, e: i.e, score: sc }); });
      listHits.slice(0, 2).forEach(function (e) { cands.push({ src: 'list', e: e, score: searchScore(e, q) }); });
      cands.sort(function (a, b) { return b.score - a.score; });
      const top = cands[0];
      const next = cands[1] ? cands[1].score : 0;
      if (top && (top.score >= 950 || (top.score >= 70 && top.score - next >= 40))) best = top;
    }
    const bestCode = best ? best.e.code : null;
    function statusFor(e, badge) {
      const current = s.code === e.code && !s.pending;
      const clash = !current && usedElsewhere(ctx, e.code, s.id);
      return { current: current, clash: clash, html: (badge ? '<span class="status status-best">' + badge + '</span>' : '') + (current ? '<span class="status status-essential">Selected</span>' : clash ? '<span class="status status-non">In plan</span>' : '') };
    }

      return '<button type="button" class="pick" data-action="pick" data-code="' + esc(e.code) + '"' + (st.clash || disabledReason ? ' disabled' : '') + (st.current ? ' aria-current="true"' : '') + '>' +
        '<span class="p-code">' + hlCode(e.code, q) + '</span><span class="p-title">' + hl(e.title, q) + '</span>' +
        '<span class="p-side"><span class="pills">' + pillsFor(item.off) + '</span>' + st.html + '</span>' +
        '<span class="p-meta"><span>' + esc(e.level || '') + '</span><span>' + esc(e.source || '') + '</span>' + (other && other !== '—' ? '<span>' + (s.session === 'Autumn' ? 'Spring' : 'Autumn') + ': ' + esc(other) + '</span>' : '') + (s.kind !== 'llb' && s.kind !== 'elective' ? '<span>' + esc(e.component.replace(/^.*?: /, '')) + '</span>' : '') + (s.kind === 'elective' ? '<span>LLB Alternate</span>' : '') + '</span></button>';
    }
    function listRow(e, badge) {
      const st = statusFor(e, badge);
      const off = e.handbook ? offerFor(ctx.deg, e.code, s.session) : null;
      return '<button type="button" class="pick" data-action="pick" data-src="list" data-code="' + esc(e.code) + '"' + (st.clash ? ' disabled' : '') + (st.current ? ' aria-current="true"' : '') + '>' +
        '<span class="p-code">' + hlCode(e.code, q) + '</span><span class="p-title">' + hl(e.title, q) + '</span>' +
        '<span class="p-side">' + (off ? '<span class="pills">' + pillsFor(off) + '</span>' : '<span class="muted small">Check Handbook</span>') + st.html + '</span>' +
        '<span class="p-meta"><span>' + esc(e.level) + '</span><span>' + (e.handbook ? '2027 Handbook data' : 'WSU subject list') + '</span>' + (off && off.none ? '<span>Not offered in ' + s.session + '</span>' : '') + '</span></button>';
    }
    const notBest = function (i) { return (i.e || i).code !== bestCode; };
    let html = '';
    if (best) {
      const badge = best.score >= 950 ? 'Exact match' : 'Best match';

      html += '<div class="pick-section pick-best"><h4><span>' + badge + '</span></h4><div class="pick-list">' + (best.src === 'list' ? listRow(best.e, badge) : row(best.item, best.off ? 'off' : false, badge)) + '</div>' +
        (best.off ? '<p class="pick-hint">' + esc(best.e.code) + ' runs only in ' + otherSession + ', so it cannot go in this ' + s.session + ' slot.</p>' : '') + '</div>';
    }
    const offered = groups.offered.filter(notBest);
    const tbc = groups.tbc.filter(notBest);

        (offered.length ? offered.map(function (i) { return row(i); }).join('') : '<div class="pick-empty">' + (best && best.src === 'pool' ? 'No other matches' : 'No matching subjects') + ' offered in ' + s.session + '.</div>') + '</div></div>';
    } else {

    if (listOn) html += extraPickSection(p, q, listPool, listHits.filter(notBest), listRow, best && best.src === 'list');

    if (p.showOff && groups.off.length) html += '<div class="pick-section"><h4><span>Not offered in ' + s.session + '</span><span>' + groups.off.length + '</span></h4><div class="pick-list">' + groups.off.map(function (i) { return row(i, 'off'); }).join('') + '</div></div>';

    $('#pick-results').innerHTML = html;

  function pdHeader(ctx) {
    const d = ctx.deg;
    const o = ctx.opt;

  // Packs the document's unbreakable blocks into A4 pages the way the print engine does
  // (break-inside: avoid on headers, year blocks and footer boxes; table rows may split).
  function estimatePages(doc, orient) {
    const mm = doc.offsetWidth / (orient === 'landscape' ? 297 : 210);
    const pageH = (orient === 'landscape' ? 190 : 277) * mm;
    const pad = 10 * mm;
    const blocks = doc.querySelectorAll('.pd-head, .pd-legend, .pd-year, .pd-foot > *, .pd-page-break, .pd-sec-h, .pd-cat-split, table.pd-cat thead, table.pd-cat tbody tr, .pd-note');
    let pages = 1;
    let start = pad;
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const top = b.getBoundingClientRect().top - doc.getBoundingClientRect().top;
      const scale = doc.getBoundingClientRect().width / doc.offsetWidth || 1;
      const t = top / scale;
      const h = b.getBoundingClientRect().height / scale;
      if (b.classList.contains('pd-page-break')) {
        pages++;
        const next = blocks[i + 1];
        start = next ? (next.getBoundingClientRect().top - doc.getBoundingClientRect().top) / scale : t;
        continue;
      }
      if (t + h - start > pageH + 0.5) {
        pages++;
        start = t;
      }
    }
    return pages;
  }

    if (!code || !title) { toast('Enter both a subject code and a title.'); return; }
    const id = ui.picker.slotId;
    if (EXTRA_BY_CODE[code]) setPick(id, { code: code, title: EXTRA_BY_CODE[code].title, list: true });
    else if (GLOBAL_BY_CODE[code]) setPick(id, { code: code, title: GLOBAL_BY_CODE[code].title });
    else setPick(id, { code: code.slice(0, 16), title: title.slice(0, 140), custom: true });
    closeModal();
    render();
    flashSlot(id);
  });

  document.addEventListener('change', function (ev) {
    const t = ev.target;
    if (t.id === 'sel-degree') { state.degree = t.value; render(); }
    else if (t.id === 'sel-major') { setMajor(t.value); render(); }
    else if (t.id === 'sel-campus') { state.campus = t.value; render(); }
    else if (t.dataset && t.dataset.action === 'done') {
      const key = currentKey();
      state.done[key] = state.done[key] || {};
      if (t.checked) state.done[key][t.dataset.slot] = 1; else delete state.done[key][t.dataset.slot];
      render();
    } else if (t.id === 'cat-comp') { ui.cat.comp = t.value; renderCatalogueRows(lastCtx); }
    else if (t.id === 'cat-session') { ui.cat.session = t.value; renderCatalogueRows(lastCtx); }
    else if (t.id === 'cat-inplan') { ui.cat.inPlan = t.checked; renderCatalogueRows(lastCtx); }
    else if (t.name && t.name.indexOf('exp-') === 0) {
      const k = t.name.slice(4);
      state.exp[k] = t.type === 'checkbox' ? t.checked : t.value;
      saveState();
      renderExportPreview();
    }
  });

  document.addEventListener('input', function (ev) {
    const t = ev.target;
    if (t.id === 'pick-q') { ui.picker.q = t.value; renderPickerResults(); }
    else if (t.id === 'cat-q') { ui.cat.q = t.value; renderCatalogueRows(lastCtx); }
    else if (t.id === 'cu-code') {
      const known = EXTRA_BY_CODE[normCode(t.value)] || GLOBAL_BY_CODE[normCode(t.value)];
      const title = $('#cu-title');
      if (known && (!title.value || title.dataset.auto)) { title.value = known.title; title.dataset.auto = '1'; }
      else if (!known && title.dataset.auto) { title.value = ''; delete title.dataset.auto; }
    } else if (t.id === 'cu-title') { delete t.dataset.auto; }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && ui.modal) { closeModal(); return; }
    const el = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.action) {
      ev.preventDefault();
      el.click();
    }
  });

  window.addEventListener('resize', function () { if (ui.modal === 'export') renderExportPreview(); });
  // remember whether the advisory panel is open across re-renders (toggle does not bubble)
  document.addEventListener('toggle', function (ev) { if (ev.target.id === 'advisory-box') ui.advisoryOpen = ev.target.open; }, true);

  // ======================================================================== boot
  applyHash();
  document.querySelectorAll('[data-crest]').forEach(function (el) { el.innerHTML = CREST_SVG; });
  render();

  // test hook: lets the automated checks drive the app without relying on UI layout
  window.WSLSA = {
    state: function () { return JSON.parse(JSON.stringify(state)); },
    context: function () { return buildContext(); },
    keys: function () { return Object.keys(PATH); },
    extraCount: function () { return EXTRA.length; },
    select: function (key) { const d = key.split('|')[0]; state.degree = d; state.majorFor[d] = key; render(); },
    buildPrintDoc: function (opts) { return buildPrintDoc(buildContext(), Object.assign({}, state.exp, opts || {})); },
    preparePrint: function (opts) { Object.assign(state.exp, opts || {}); preparePrint(); },
  };
})();

</script>
</body>
</html>
